{
  "app": {
    "name": "enterprise-ai-readiness-agent",
    "environment": "local"
  },
  "provider": {
    "name": "mock",
    "model": "mock-v1",
    "timeout_seconds": 30,
    "max_retries": 2
  },
  "workflow": {
    "stages": [
      "ingest_assessment_evidence",
      "score_readiness_domains",
      "validate_scores_against_evidence",
      "identify_blockers_and_dependencies",
      "prioritize_use_cases_and_foundations",
      "build_target_maturity_profile",
      "generate_30_60_90_and_12_month_roadmap",
      "produce_executive_assessment"
    ],
    "checkpoint_each_stage": true,
    "state_directory": "out/state"
  },
  "risk": {
    "default_approval_threshold": "HIGH"
  },
  "approval": {
    "mode": "manual",
    "required_for_mutations": true
  },
  "observability": {
    "log_level": "INFO",
    "structured": true
  },
  "tools": {
    "mode": "fake",
    "allow_mutations": false
  }
}
